name: Build JokerShift APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "HOME=$HOME ANDROID_HOME=${ANDROID_HOME:-} JAVA_HOME=${JAVA_HOME:-}"
          godot --version
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.2.stable"
          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            FOUND=$(find /root /opt /usr/local -name android_debug.apk -print -quit 2>/dev/null || true)
            if [ -n "$FOUND" ]; then
              cp "$(dirname "$FOUND")"/android_*.apk "$TEMPLATE_DIR/"
            else
              apt-get update && apt-get install -y unzip curl
              curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz"
              unzip -o /tmp/templates.tpz 'templates/android_*.apk' -d /tmp/godot-templates
              cp /tmp/godot-templates/templates/android_*.apk "$TEMPLATE_DIR/"
            fi
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          JAVA="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          echo "SDK=$SDK JAVA=$JAVA"
          ls "$SDK" || true
          ls "$JAVA" || true
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA"
          EOF
      - name: Import Godot project
        run: godot --headless --path JokerShift-Android-ready --editor --import --quit
      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path JokerShift-Android-ready --export-debug Android "$GITHUB_WORKSPACE/build/JokerShift.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: JokerShift-Android-APK
          path: build/JokerShift.apk
          if-no-files-found: error
